server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    add_header X-Content-Type-Options nosniff always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;
    location /v1/ { proxy_pass http://api:5000; proxy_set_header Host $host; }
    location /health/ { proxy_pass http://api:5000; }
    location / { try_files $uri $uri/ /index.html; }
}
